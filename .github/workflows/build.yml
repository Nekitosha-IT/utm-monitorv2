name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore EGAISInspector.sln
      - name: Build
        run: dotnet build EGAISInspector.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test EGAISInspector.Tests/EGAISInspector.Tests.csproj --configuration Release --no-build
