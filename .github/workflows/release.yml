name: release

on:
  push:
    paths:
      - '.release-trigger/v0.1.0-preview'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 0.1.1-preview'
        required: true
        default: '0.1.1-preview'

permissions:
  contents: write

env:
  RELEASE_TRIGGER_FILE: .release-trigger/v0.1.0-preview

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $version = '${{ inputs.version }}'
          } else {
            $line = Get-Content -LiteralPath $env:RELEASE_TRIGGER_FILE | Where-Object { $_ -match '^release\s+v?(.+)$' } | Select-Object -First 1
            if (-not $line) { throw "Release version was not found in $env:RELEASE_TRIGGER_FILE" }
            $version = [regex]::Match($line, '^release\s+v?(.+)$').Groups[1].Value.Trim()
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Invalid release version: $version"
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Resolved release version: $version"

      - name: Restore
        run: dotnet restore EGAISInspector.sln --runtime win-x64

      - name: Test
        run: dotnet test EGAISInspector.Tests/EGAISInspector.Tests.csproj --configuration Release --no-restore

      - name: Publish self-contained Windows x64
        run: >-
          dotnet publish EGAISInspector.App/EGAISInspector.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/publish
          --no-restore

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Pack Velopack beta release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/release | Out-Null
          vpk pack `
            --packId EGAISInspector `
            --packVersion $env:VERSION `
            --packDir artifacts/publish `
            --mainExe EGAISInspector.exe `
            --packTitle "EGAIS Inspector" `
            --packAuthors "Nekitosha-IT" `
            --channel beta `
            --outputDir artifacts/release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: EGAIS Inspector v${{ env.VERSION }}
          prerelease: true
          generate_release_notes: true
          files: |
            artifacts/release/*
